<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手書きノートアプリ</title>
    <!-- PDF.js の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --sidebar-bg: #ffffff;
            --border-color: #dfe1e6;
            --primary-color: #0052cc;
            --text-color: #172b4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            position: relative;
        }

        /* サイドバー */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            height: 100%;
            transition: transform 0.25s ease;
        }

        body.sidebar-closed .sidebar {
            transform: translateX(-100%);
            position: absolute;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
        }

        .btn-new {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-new:hover {
            opacity: 0.9;
        }

        .note-list {
            flex: 1;
            overflow-y: auto;
        }

        .note-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }

        .note-item:hover {
            background-color: #ebecf0;
        }

        .note-item.active {
            background-color: #deebff;
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn-delete-item {
            background: none;
            border: none;
            color: #de350b;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-delete-item:hover {
            background-color: #ffebe6;
        }

        /* メインエリア */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .toolbar {
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            flex-shrink: 0;
            z-index: 5;
            overflow-x: auto;
        }

        .btn-toggle-sidebar {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-tool, select.btn-tool {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-tool.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-tool:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        input[type="range"] {
            cursor: pointer;
            width: 70px;
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            background-color: #e4e7eb;
            overflow: hidden;
            touch-action: none;
        }

        /* 用紙コンテナ */
        .paper-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 背景パターンのクラス定義 */
        .paper-container.bg-grid {
            background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .paper-container.bg-lined {
            background-image: linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
            background-size: 100% 32px;
        }

        .paper-container.bg-blank {
            background-image: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            mix-blend-mode: multiply;
        }

        .canvas-wrapper.mode-hand canvas {
            cursor: grab;
        }
        .canvas-wrapper.mode-hand.is-dragging canvas {
            cursor: grabbing;
        }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6b778c;
            font-size: 1.1rem;
            pointer-events: none;
            text-align: center;
            z-index: 10;
            width: 80%;
        }
    </style>
</head>
<body class="sidebar-closed">

    <!-- サイドバー：ノート一覧 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>ノート一覧</h2>
            <button class="btn-new" id="btn-new">+ 新規</button>
        </div>
        <div class="note-list" id="note-list"></div>
    </div>

    <!-- メインエディタエリア -->
    <div class="main-content">
        <div class="toolbar" id="toolbar" style="display: none;">
            <button class="btn-toggle-sidebar" id="btn-toggle">≡</button>
            <div class="tool-group">
                <button class="btn-tool active" id="btn-pen">ペン</button>
                <button class="btn-tool" id="btn-marker">蛍光ペン</button>
                <button class="btn-tool" id="btn-eraser">消しゴム</button>
                <button class="btn-tool" id="btn-hand" title="画面移動・拡大縮小">✋ 画面移動</button>
            </div>
            <div class="tool-group">
                <!-- 直線モード切り替えボタン -->
                <button class="btn-tool" id="btn-straight" title="直線モード切替">📏 直線モード</button>
            </div>
            <div class="tool-group">
                <button class="btn-tool" id="btn-undo" title="一つ戻る" disabled>↩ 戻る</button>
                <button class="btn-tool" id="btn-redo" title="一つ進む" disabled>↪ 進む</button>
            </div>
            <div class="tool-group">
                <input type="color" id="color-picker" value="#172b4d">
                <input type="range" id="brush-size" min="1" max="50" value="3">
            </div>
            <div class="tool-group">
                <select id="size-select" class="btn-tool">
                    <option value="a4">A4サイズ</option>
                    <option value="b5">B5サイズ</option>
                    <option value="free">フリーサイズ</option>
                </select>
                <select id="bg-select" class="btn-tool">
                    <option value="grid">方眼</option>
                    <option value="lined">横罫線</option>
                    <option value="blank">白紙</option>
                </select>
                <input type="file" id="file-loader" accept="image/jpeg,image/png,application/pdf" style="display: none;">
                <button class="btn-tool" id="btn-load-file">📄 PDF/画像読み込み</button>
            </div>
            <div class="tool-group" style="margin-left: auto;">
                <button class="btn-tool" id="btn-clear" style="color: #de350b; border-color: #de350b;">全消去</button>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvas-wrapper">
            <button class="btn-toggle-sidebar" id="btn-toggle-floating" style="position: absolute; top: 12px; left: 12px; z-index: 10;">≡ メニュー</button>
            <div class="placeholder" id="placeholder">「≡ メニュー」からノートを選択または新規作成してください</div>
            <div class="paper-container bg-grid" id="paper-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('my_handwritten_notes')) || [];
        let activeNoteId = null;

        let isDrawing = false;
        let currentTool = 'pen';
        let isStraightMode = false; // 直線モードの状態
        let currentColor = '#172b4d';
        let currentSize = 3;

        let panX = 0;
        let panY = 0;
        let scale = 1;

        const PAPER_SIZES = {
            a4: { width: 842, height: 1191 },
            b5: { width: 709, height: 1003 },
            free: { width: 1200, height: 1600 }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const paperContainer = document.getElementById('paper-container');
        const noteListEl = document.getElementById('note-list');
        const btnNew = document.getElementById('btn-new');
        const toolbar = document.getElementById('toolbar');
        const placeholder = document.getElementById('placeholder');
        const btnPen = document.getElementById('btn-pen');
        const btnMarker = document.getElementById('btn-marker');
        const btnEraser = document.getElementById('btn-eraser');
        const btnHand = document.getElementById('btn-hand');
        const btnStraight = document.getElementById('btn-straight');
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const colorPicker = document.getElementById('color-picker');
        const brushSize = document.getElementById('brush-size');
        const sizeSelect = document.getElementById('size-select');
        const bgSelect = document.getElementById('bg-select');
        const fileLoader = document.getElementById('file-loader');
        const btnLoadFile = document.getElementById('btn-load-file');
        const btnClear = document.getElementById('btn-clear');
        const btnToggle = document.getElementById('btn-toggle');
        const btnToggleFloating = document.getElementById('btn-toggle-floating');

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-closed');
            setTimeout(updateTransform, 300);
        }
        btnToggle.onclick = toggleSidebar;
        btnToggleFloating.onclick = toggleSidebar;

        function updateTransform() {
            paperContainer.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }

        function initNoteView(resetPos = false) {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            if (!note.paperSize) note.paperSize = 'a4';
            if (!note.bg) note.bg = 'grid';
            if (!note.redoPaths) note.redoPaths = [];

            sizeSelect.value = note.paperSize;
            bgSelect.value = note.bg;
            applyBackground(note);

            let sizeDef;
            if (note.paperSize === 'free' && note.customWidth && note.customHeight) {
                sizeDef = { width: note.customWidth, height: note.customHeight };
            } else {
                sizeDef = PAPER_SIZES[note.paperSize] || PAPER_SIZES.a4;
            }

            canvas.width = sizeDef.width;
            canvas.height = sizeDef.height;
            canvas.style.width = sizeDef.width + 'px';
            canvas.style.height = sizeDef.height + 'px';
            paperContainer.style.width = sizeDef.width + 'px';
            paperContainer.style.height = sizeDef.height + 'px';

            if (resetPos) {
                panX = 0;
                panY = 0;
                const wrapperW = wrapper.clientWidth;
                const wrapperH = wrapper.clientHeight;
                const scaleX = (wrapperW * 0.85) / sizeDef.width;
                const scaleY = (wrapperH * 0.85) / sizeDef.height;
                scale = Math.min(scaleX, scaleY, 1);
            }

            updateTransform();
            drawActiveNote();
            updateUndoRedoButtons();
        }

        function applyBackground(note) {
            paperContainer.classList.remove('bg-grid', 'bg-lined', 'bg-blank');
            if (note.bgImage) {
                paperContainer.style.backgroundImage = `url(${note.bgImage})`;
            } else {
                paperContainer.style.backgroundImage = '';
                if (note.bg === 'lined') {
                    paperContainer.classList.add('bg-lined');
                } else if (note.bg === 'blank') {
                    paperContainer.classList.add('bg-blank');
                } else {
                    paperContainer.classList.add('bg-grid');
                }
            }
        }

        function renderNoteList() {
            noteListEl.innerHTML = '';
            notes.sort((a, b) => b.updatedAt - a.updatedAt);

            notes.forEach((note, index) => {
                const item = document.createElement('div');
                item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                
                const dateObj = new Date(note.updatedAt);
                const titleText = `ノート ${notes.length - index} (${dateObj.getMonth() + 1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')})`;

                const span = document.createElement('span');
                span.textContent = titleText;
                span.style.flex = '1';
                span.onclick = () => {
                    selectNote(note.id, true);
                    if (window.innerWidth <= 768) {
                        document.body.classList.add('sidebar-closed');
                        setTimeout(updateTransform, 300);
                    }
                };
                item.appendChild(span);

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete-item';
                delBtn.textContent = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteNote(note.id);
                };
                item.appendChild(delBtn);

                noteListEl.appendChild(item);
            });
        }

        function selectNote(id, resetPos = false) {
            activeNoteId = id;
            toolbar.style.display = 'flex';
            btnToggleFloating.style.display = 'none';
            placeholder.style.display = 'none';
            
            initNoteView(resetPos);
            renderNoteList();
        }

        btnNew.onclick = () => {
            const newNote = {
                id: Date.now().toString(),
                updatedAt: Date.now(),
                paperSize: 'a4',
                bg: 'grid',
                bgImage: null,
                customWidth: null,
                customHeight: null,
                paths: [],
                redoPaths: []
            };
            notes.push(newNote);
            saveNotesToStorage();
            selectNote(newNote.id, true);
            if (window.innerWidth <= 768) {
                document.body.classList.add('sidebar-closed');
                setTimeout(updateTransform, 300);
            }
        };

        function deleteNote(id) {
            if (!confirm('このノートを削除しますか？')) return;
            notes = notes.filter(n => n.id !== id);
            saveNotesToStorage();

            if (activeNoteId === id) {
                activeNoteId = null;
                toolbar.style.display = 'none';
                btnToggleFloating.style.display = 'block';
                placeholder.style.display = 'block';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            renderNoteList();
        }

        function saveNotesToStorage() {
            localStorage.setItem('my_handwritten_notes', JSON.stringify(notes));
        }

        function updateUndoRedoButtons() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            btnUndo.disabled = !note.paths || note.paths.length === 0;
            btnRedo.disabled = !note.redoPaths || note.redoPaths.length === 0;
        }

        function drawPath(path) {
            if (path.points.length < 2) return;
            ctx.beginPath();
            
            if (path.isStraight) {
                ctx.moveTo(path.points[0].x, path.points[0].y);
                ctx.lineTo(path.points[path.points.length - 1].x, path.points[path.points.length - 1].y);
            } else {
                ctx.moveTo(path.points[0].x, path.points[0].y);
                for (let i = 1; i < path.points.length; i++) {
                    ctx.lineTo(path.points[i].x, path.points[i].y);
                }
            }

            ctx.strokeStyle = path.color;
            ctx.lineWidth = path.width;
            ctx.lineCap = (path.tool === 'marker' || path.isStraight) ? 'square' : 'round';
            ctx.lineJoin = 'round';

            if (path.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.globalAlpha = 1.0;
            } else if (path.tool === 'marker') {
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.4;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
            }
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
        }

        function drawActiveNote() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.paths) return;

            note.paths.forEach(path => {
                drawPath(path);
            });
        }

        btnUndo.onclick = () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.paths || note.paths.length === 0) return;
            const removed = note.paths.pop();
            note.redoPaths.push(removed);
            note.updatedAt = Date.now();
            saveNotesToStorage();
            drawActiveNote();
            updateUndoRedoButtons();
            renderNoteList();
        };

        btnRedo.onclick = () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.redoPaths || note.redoPaths.length === 0) return;
            const restored = note.redoPaths.pop();
            note.paths.push(restored);
            note.updatedAt = Date.now();
            saveNotesToStorage();
            drawActiveNote();
            updateUndoRedoButtons();
            renderNoteList();
        };

        btnLoadFile.onclick = () => fileLoader.click();

        fileLoader.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    try {
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        const page = await pdf.getPage(1);
                        const viewport = page.getViewport({ scale: 2.0 });
                        
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = viewport.width;
                        tempCanvas.height = viewport.height;
                        const tempCtx = tempCanvas.getContext('2d');

                        await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;
                        
                        note.bgImage = tempCanvas.toDataURL('image/jpeg');
                        note.paperSize = 'free';
                        note.customWidth = viewport.width;
                        note.customHeight = viewport.height;
                        
                        note.updatedAt = Date.now();
                        saveNotesToStorage();
                        initNoteView(true);
                        renderNoteList();
                    } catch (err) {
                        alert('PDFの読み込みに失敗しました。');
                    }
                };
                reader.readAsArrayBuffer(file);
            } else if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        note.bgImage = event.target.result;
                        note.paperSize = 'free';
                        note.customWidth = img.naturalWidth;
                        note.customHeight = img.naturalHeight;

                        note.updatedAt = Date.now();
                        saveNotesToStorage();
                        initNoteView(true);
                        renderNoteList();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                alert('対応している形式は JPEG, PNG, PDF のみです。');
            }
            fileLoader.value = '';
        };

        let currentPath = null;
        let pointers = new Map();
        let initialPinchDistance = null;
        let initialScale = 1;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / scale,
                y: (e.clientY - rect.top) / scale
            };
        }

        wrapper.addEventListener('pointerdown', (e) => {
            if (!activeNoteId) return;
            pointers.set(e.pointerId, e);

            if (currentTool === 'hand' || e.button === 1 || pointers.size === 2 || e.shiftKey) {
                isPanning = true;
                wrapper.classList.add('is-dragging');
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                return;
            }

            if (pointers.size === 1 && (currentTool === 'pen' || currentTool === 'marker' || currentTool === 'eraser')) {
                isDrawing = true;
                const pos = getCanvasPos(e);
                currentPath = {
                    tool: currentTool,
                    isStraight: isStraightMode,
                    color: currentTool === 'eraser' ? 'rgba(0,0,0,1)' : currentColor,
                    width: currentSize,
                    points: [pos]
                };
                const note = notes.find(n => n.id === activeNoteId);
                if (note) {
                    note.paths.push(currentPath);
                    note.redoPaths = [];
                }
            }
        });

        wrapper.addEventListener('pointermove', (e) => {
            if (!activeNoteId) return;
            pointers.set(e.pointerId, e);

            if (pointers.size === 2) {
                isDrawing = false;
                const pts = Array.from(pointers.values());
                const dist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                if (initialPinchDistance === null) {
                    initialPinchDistance = dist;
                    initialScale = scale;
                } else {
                    const newScale = Math.min(Math.max(initialScale * (dist / initialPinchDistance), 0.1), 10.0);
                    scale = newScale;
                    updateTransform();
                }
                return;
            }

            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
                return;
            }

            if (isDrawing && currentPath) {
                const pos = getCanvasPos(e);
                if (currentPath.isStraight) {
                    if (currentPath.points.length > 1) {
                        currentPath.points[1] = pos;
                    } else {
                        currentPath.points.push(pos);
                    }
                } else {
                    currentPath.points.push(pos);
                }
                drawActiveNote();
            }
        });

        const endPointer = (e) => {
            pointers.delete(e.pointerId);
            if (pointers.size < 2) {
                initialPinchDistance = null;
            }
            if (pointers.size === 0) {
                if (isDrawing && activeNoteId) {
                    isDrawing = false;
                    const note = notes.find(n => n.id === activeNoteId);
                    if (note) {
                        note.updatedAt = Date.now();
                        saveNotesToStorage();
                        updateUndoRedoButtons();
                        renderNoteList();
                    }
                }
                if (isPanning) {
                    isPanning = false;
                    wrapper.classList.remove('is-dragging');
                }
            }
        };

        wrapper.addEventListener('pointerup', endPointer);
        wrapper.addEventListener('pointercancel', endPointer);

        wrapper.addEventListener('wheel', (e) => {
            if (!activeNoteId) return;
            e.preventDefault();
            const zoomFactor = 1.1;
            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            scale = Math.min(Math.max(newScale, 0.1), 10.0);
            updateTransform();
        }, { passive: false });

        function setTool(tool) {
            currentTool = tool;
            btnPen.classList.toggle('active', tool === 'pen');
            btnMarker.classList.toggle('active', tool === 'marker');
            btnEraser.classList.toggle('active', tool === 'eraser');
            btnHand.classList.toggle('active', tool === 'hand');
            wrapper.classList.toggle('mode-hand', tool === 'hand');

            if (tool === 'marker') {
                brushSize.value = 25;
                currentSize = 25;
            } else if (tool === 'pen') {
                brushSize.value = 3;
                currentSize = 3;
            }
        }

        btnPen.onclick = () => setTool('pen');
        btnMarker.onclick = () => setTool('marker');
        btnEraser.onclick = () => setTool('eraser');
        btnHand.onclick = () => setTool('hand');

        // 直線モードボタンの切り替え
        btnStraight.onclick = () => {
            isStraightMode = !isStraightMode;
            btnStraight.classList.toggle('active', isStraightMode);
        };

        colorPicker.oninput = (e) => { currentColor = e.target.value; };
        brushSize.oninput = (e) => { currentSize = Number(e.target.value); };

        sizeSelect.onchange = (e) => {
            if (!activeNoteId) return;
            const newSize = e.target.value;
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.paperSize = newSize;
                if (newSize !== 'free') {
                    note.customWidth = null;
                    note.customHeight = null;
                }
                note.updatedAt = Date.now();
                saveNotesToStorage();
                initNoteView(true);
            }
        };

        bgSelect.onchange = (e) => {
            if (!activeNoteId) return;
            const bgType = e.target.value;
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.bg = bgType;
                note.bgImage = null;
                note.customWidth = null;
                note.customHeight = null;
                note.updatedAt = Date.now();
                saveNotesToStorage();
                applyBackground(note);
                initNoteView(true);
            }
        };

        btnClear.onclick = () => {
            if (!activeNoteId) return;
            if (confirm('このノートの文字をすべて消去しますか？')) {
                const note = notes.find(n => n.id === activeNoteId);
                if (note) {
                    note.paths = [];
                    note.redoPaths = [];
                    note.updatedAt = Date.now();
                    saveNotesToStorage();
                    drawActiveNote();
                    updateUndoRedoButtons();
                    renderNoteList();
                }
            }
        };

        if (notes.length > 0) {
            renderNoteList();
        }
    </script>
</body>
</html>
